services:
  redis:
    image: redis:alpine
    container_name: tel2bale_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --rename-command EVAL ""
      --rename-command EVALSHA ""
      --rename-command SCRIPT ""
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  bot:
    build: .
    container_name: tel2bale
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    env_file:
      - .env
    volumes:
      - ./bot.db:/app/bot.db
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./downloads:/app/downloads
